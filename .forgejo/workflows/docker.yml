name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The job image's Node 24 (/opt/acttoolcache) is on PATH already; setup-node would fetch the newest 24.x and
      # copy it into an empty tool cache instead (20 s to 2.5 min on the runner's busy disk), so run it only without one
      - id: node
        run: node -v | grep -q '^v24\.' && echo have=1 >> "$GITHUB_OUTPUT" || true
      - uses: actions/setup-node@v4
        if: steps.node.outputs.have != '1'
        with:
          node-version: 24

      - name: Test
        run: npm ci && npm test

      - name: Point docker at the runner's Docker daemon
        # The runner's dind daemon only accepts TLS clients holding its client certificate (repo secrets DIND_*)
        env:
          DIND_CA: ${{ secrets.DIND_CA }}
          DIND_CERT: ${{ secrets.DIND_CERT }}
          DIND_KEY: ${{ secrets.DIND_KEY }}
        run: |
          d=/tmp/dind-certs && mkdir -p "$d" && cd "$d"
          printf '%s\n' "$DIND_CA" > ca.pem
          printf '%s\n' "$DIND_CERT" > cert.pem
          (umask 077 && printf '%s\n' "$DIND_KEY" > key.pem)
          printf 'DOCKER_HOST=tcp://172.31.250.2:2376\nDOCKER_TLS_VERIFY=1\nDOCKER_CERT_PATH=%s\n' "$d" >> "$GITHUB_ENV"

      # No setup-qemu-action: its registrations vanish when the binfmt container exits inside the
      # rootless dind. The runner's binfmt sidecar keeps qemu-aarch64 registered there for linux/arm64.
      # One named builder stays up on the runner's dind across runs (and repos), so base images and unchanged
      # layers come from its cache instead of being pulled and rebuilt every time, and no job waits on stopping
      # it. To reset it: docker rm -f buildx_buildkit_release-builder0 && docker volume rm buildx_buildkit_release-builder0_state
      - uses: docker/setup-buildx-action@v3
        with:
          name: release-builder
          cleanup: false

      - uses: docker/login-action@v3
        if: github.event_name == 'release' # DRYRUN
        with:
          registry: ghcr.io
          username: backmeupplz
          password: ${{ secrets.GH_MIRROR_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          # keep the GHCR package linked to the GitHub mirror
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false # DRYRUN
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Releases don't mirror: publish the same release on GitHub once the tag has reached the mirror
  github-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          TITLE: ${{ github.event.release.name }}
          NOTES: ${{ github.event.release.body }}
        run: |
          for i in $(seq 30); do gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1 && break; sleep 10; done
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "${TITLE:-$TAG}" --notes "$NOTES"
