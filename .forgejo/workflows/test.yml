name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Node 24 + Chromium + its system deps preinstalled; keep the tag equal to
    # @playwright/test in package-lock.json.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # No-op while the image tag matches; downloads the browser if they drift.
      - run: npx playwright install chromium
      - name: Unit and layout tests in parallel
        run: |
          npm test > unit.log 2>&1 & unit=$!
          npm run test:layout || layout=$?
          wait $unit || { cat unit.log; exit 1; }
          cat unit.log
          exit ${layout:-0}

  nix:
    runs-on: ubuntu-latest
    # Nix preinstalled; no Node in this image, so check out with plain git.
    container: nixos/nix:2.35.4
    steps:
      - run: |
          git init -q . && git fetch -q --depth=1 ${{ github.server_url }}/${{ github.repository }} ${{ github.ref }}
          git checkout -q FETCH_HEAD
          nix --extra-experimental-features 'nix-command flakes' flake check -L
