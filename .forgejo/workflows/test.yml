name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Our pushes and PRs run on the Mac runners (Homebrew Node, Chromium kept
    # in forgejo-ci's ~/Library/Caches/ms-playwright). Outsider PRs run on Linux
    # in the Playwright image (Node 24 + Chromium + system deps preinstalled;
    # keep its tag equal to @playwright/test in package-lock.json).
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'ubuntu-latest' }}
    container: ${{ !(github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude"]'), github.event.pull_request.user.login)) && 'mcr.microsoft.com/playwright:v1.63.0-noble' || '' }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # No-op once the browser for this Playwright version is present.
      - run: npx playwright install --only-shell chromium
      - name: Unit and layout tests in parallel
        run: |
          npm test > unit.log 2>&1 & unit=$!
          npm run test:layout || layout=$?
          wait $unit || { cat unit.log; exit 1; }
          cat unit.log
          exit ${layout:-0}

