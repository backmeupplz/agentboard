<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>agentboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><defs><linearGradient id='g' x2='1' y2='1'><stop stop-color='%237c8cff'/><stop offset='1' stop-color='%23a78bfa'/></linearGradient></defs><rect width='24' height='24' rx='7' fill='url(%23g)'/><g transform='translate(4.5 4.5) scale(.625)' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='18' x='3' y='3' rx='2'/><path d='M9 3v18M15 3v18'/></g></svg>">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" type="module"></script>
</head>
<body>
<form id="auth" class="auth" hidden>
  <div class="brand"><span class="mark"><svg class="i"><use href="/icons.svg#columns-3"/></svg></span> agentboard</div>
  <p id="auth-hint" class="dim"></p>
  <input name="name" placeholder="Username" autocomplete="username" hidden>
  <input name="email" type="email" placeholder="Email" autocomplete="email" required>
  <input name="password" type="password" placeholder="Password" autocomplete="current-password" minlength="8" required>
  <button class="btn primary">Sign in</button>
  <p class="error" id="auth-error" role="alert"></p>
</form>

<div id="app" hidden>
  <header>
    <div class="brand"><span class="mark"><svg class="i"><use href="/icons.svg#columns-3"/></svg></span><span class="name">agentboard</span></div>
    <label class="search"><svg class="i"><use href="/icons.svg#search"/></svg><input id="f-q" type="search" placeholder="Search or #id" aria-label="Search"></label>
    <select id="f-project" aria-label="Project filter"></select>
    <select id="f-assignee" aria-label="Assignee filter"></select>
    <span class="grow"></span>
    <span id="live" title="Connecting…"></span>
    <button id="btn-new" class="btn primary"><svg class="i"><use href="/icons.svg#plus"/></svg><span>New</span></button>
    <button id="btn-theme" class="btn ghost icon" title="Theme" aria-label="Theme"><svg class="i"><use href="/icons.svg#sun-moon"/></svg></button>
    <button id="btn-activity" class="btn ghost icon" title="Activity" aria-label="Activity"><svg class="i"><use href="/icons.svg#activity"/></svg></button>
    <button id="btn-settings" class="btn ghost icon" title="Settings" aria-label="Settings"><svg class="i"><use href="/icons.svg#settings"/></svg></button>
    <button id="btn-logout" class="btn ghost icon" title="Sign out" aria-label="Sign out"><svg class="i"><use href="/icons.svg#log-out"/></svg></button>
  </header>
  <main>
    <div id="board"></div>
    <aside id="activity" aria-label="Activity">
      <div class="aside-head"><b>Activity</b><button id="btn-activity-close" class="btn ghost icon sm" title="Close" aria-label="Close"><svg class="i"><use href="/icons.svg#x"/></svg></button></div>
      <ol id="feed"></ol>
    </aside>
  </main>
</div>

<dialog id="ticket"></dialog>
<dialog id="settings"></dialog>
<dialog id="lightbox"><img alt=""></dialog>
<div id="toasts" aria-live="polite"></div>
</body>
</html>
